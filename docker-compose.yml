# SEECARAUTO — local development stack (Docker Compose).
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose ps          # check health: all services should be (healthy)
#   docker compose logs -f
#   docker compose down
#
# Ports: frontend 3000, admin 3001, backend 3002, postgres 5432,
#        redis 6379, meilisearch 7700.
# Volumes persist local data in named volumes (never committed to git).
#
# NOTE (M00): on Muse's dev VM, `docker compose up` CANNOT run (cgroup
# controllers are empty — containers cannot start). The compose file is
# validated with `docker compose config`. Real `up` + health checks must be
# verified on Henry's Windows machine / VPS / CI. See
# docs/project-management/DOCKER_STANDARDS.md.

name: seecarauto

services:
  postgres:
    image: postgres:16-alpine
    container_name: seecarauto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seecarauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seecarauto_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-seecarauto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-seecarauto} -d ${POSTGRES_DB:-seecarauto}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: seecarauto-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: seecarauto-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-seecarauto_dev_master_key_only}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:7700/health || wget -q --spider http://localhost:7700/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: seecarauto-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-seecarauto}:${POSTGRES_PASSWORD:-seecarauto_dev_only}@postgres:5432/${POSTGRES_DB:-seecarauto}?schema=public
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-seecarauto_dev_master_key_only}
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_only}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_dev_only}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: seecarauto-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3002/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: seecarauto-admin
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3002/api/v1
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
