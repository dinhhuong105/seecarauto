# SEECARAUTO CI — basic pipeline (M00).
# Runs on every push and pull request to main/develop.
# NOTE: Docker `compose up` is NOT run here yet — containers cannot run on
# Muse's dev VM and this workflow only validates the compose file.
# A `docker compose up` smoke job on a real runner is a follow-up (M02).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Validate docker-compose file
        run: docker compose config --quiet

      - name: Check for committed secrets (basic scan)
        run: |
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git \
            -e 'AKIA[0-9A-Z]{16}' -e 'ghp_[A-Za-z0-9]{36}' -e 'xox[baprs]-[A-Za-z0-9-]{10,}' . ; then
            echo "Possible secret found in repository" >&2
            exit 1
          fi
          echo "No obvious secrets found."

  # CI-EXP-02 (TEMPORARY experiment, approved by ChatGPT 28/11/2026):
  # Isolate native Argon2 and each Auth suite — find out whether SIGSEGV
  # happens when loading native Argon2, when hashing/verifying, or inside
  # one of the two Auth Jest suites. Each diagnostic step is independent
  # (continue-on-error) so one SIGSEGV does not block the later probes.
  # Independent of the main job (no `needs`); same Node 20 / pnpm 10.14.0 /
  # install + Prisma generate as the main job. REVERT after the verdict.
  isolate-argon2-auth:
    name: Isolate native Argon2 + Auth suites (CI-EXP-02, temporary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Record env + require('argon2') (CI-EXP-02, temporary)
        working-directory: backend
        continue-on-error: true
        run: |
          node -e "console.log('node', process.version); console.log('platform', process.platform, process.arch); console.log('argon2 path:', require.resolve('argon2')); require('argon2'); console.log('require argon2: OK');"

      - name: Argon2id hash + verify (CI-EXP-02, temporary)
        working-directory: backend
        continue-on-error: true
        run: |
          node -e "const a = require('argon2'); (async () => { const h = await a.hash('ci-exp02-diagnostic-password'); const ok = await a.verify(h, 'ci-exp02-diagnostic-password'); console.log(ok ? 'argon2 hash+verify: PASS' : 'argon2 hash+verify: FAIL'); if (!ok) process.exit(1); })().catch(e => { console.error('argon2 hash+verify: FAIL', e.message); process.exit(1); });"

      - name: password.service.spec.ts --runInBand (CI-EXP-02, temporary)
        working-directory: backend
        continue-on-error: true
        run: pnpm exec jest src/auth/password.service.spec.ts --runInBand

      - name: auth.service.spec.ts --runInBand (CI-EXP-02, temporary)
        working-directory: backend
        continue-on-error: true
        run: pnpm exec jest src/auth/auth.service.spec.ts --runInBand
