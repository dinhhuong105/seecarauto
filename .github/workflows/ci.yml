# SEECARAUTO CI — basic pipeline (M00).
# Runs on every push and pull request to main/develop.
# NOTE: Docker `compose up` is NOT run here yet — containers cannot run on
# Muse's dev VM and this workflow only validates the compose file.
# A `docker compose up` smoke job on a real runner is a follow-up (M02).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Validate docker-compose file
        run: docker compose config --quiet

      - name: Check for committed secrets (basic scan)
        run: |
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git \
            -e 'AKIA[0-9A-Z]{16}' -e 'ghp_[A-Za-z0-9]{36}' -e 'xox[baprs]-[A-Za-z0-9-]{10,}' . ; then
            echo "Possible secret found in repository" >&2
            exit 1
          fi
          echo "No obvious secrets found."
