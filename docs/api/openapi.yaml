  /auth/admin/refresh:
    post:
      operationId: adminRefreshToken
      tags: [Auth]
      summary: Đổi refresh token lấy access token mới (xoay vòng refresh token)
      x-required-permission: null
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID — một key cho mỗi thao tác refresh; retry cùng thao tác dùng cùng key. Cùng token + cùng key → trả lại response đã lưu (envelope hết TTL → 503, không phải replay). Cùng token + key khác → replay (revoke-all + 401 TOKEN_REUSE_DETECTED).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 1 }
      responses:
        '200':
          description: Token mới (access + refresh mới)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthTokens' }
        '400':
          description: Thiếu refresh token hoặc thiếu header Idempotency-Key (VALIDATION_ERROR, details field Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Refresh token hết hạn hoặc đã thu hồi vì LOGOUT/LOGOUT_ALL/ADMIN_REVOKED (INVALID_REFRESH_TOKEN); refresh token đã dùng rồi trình lại với key khác, hoặc đã thu hồi vì REUSE_DETECTED (TOKEN_REUSE_DETECTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Vượt rate limit refresh (30 lần/phút/IP + 10 lần/phút/tài khoản)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Không xác minh được trạng thái thao tác (envelope response đã hết TTL, hoặc Redis/DB lỗi) — thử lại sau, không phải replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/admin/logout:
    post:
      operationId: adminLogout
      tags: [Auth]
      summary: "Đăng xuất — thu hồi access token + refresh token (có refreshToken: một phiên; không có refreshToken: toàn bộ phiên của tài khoản)"
      description: "Có `refreshToken` trong body → chỉ thu hồi đúng session đó (`revoked_reason = LOGOUT`). Không có `refreshToken` → thu hồi toàn bộ session của tài khoản (`revoked_reason = LOGOUT_ALL`). Access token hiện tại luôn bị blacklist tới khi hết hạn; mọi access token thuộc session đã logout đều hết hiệu lực (kiểm tra `sid`)."
      x-required-permission: "*"
      security: [{ AdminAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: ["string", "null"] }
      responses:
        '204':
          description: Đã đăng xuất
        '401':
          description: Chưa đăng nhập, hoặc refreshToken không thuộc tài khoản này / đã thu hồi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Redis lỗi khi ghi blacklist (fail-closed) — thử lại sau
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/admin/me:
