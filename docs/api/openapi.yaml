        '400':
          description: Input không hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Không có quyền products.update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Sản phẩm không tồn tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
