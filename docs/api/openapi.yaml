openapi: 3.1.0
info:
  title: SeeCar Auto API
  description: |
    API đặc tả cho website thương mại điện tử phụ tùng ô tô SeeCar Auto.
    Tài liệu chính: docs/api/API_SPEC.md (M01-03). Tài liệu này phải khớp
    API_SPEC.md — kiểm chứng bằng script đối chiếu (Test 2, API_SPEC mục 23).
    Mọi ví dụ trong file này là ví dụ minh họa, không phải dữ liệu thật.
  version: 1.0.0
  contact:
    name: SeeCar Auto
    url: https://www.facebook.com/profile.php?id=61597072672914
  license:
    name: Proprietary — internal project, not open source
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3002/api/v1
    description: Development (backend NestJS, port 3002)
  - url: https://api.seecarauto.example/api/v1
    description: Production placeholder — domain thật theo D-01 (chưa chốt)
tags:
  - name: Products
    description: Sản phẩm public và admin (FR-007 đến FR-012, FR-042 đến FR-049)
  - name: Categories
    description: Danh mục (FR-015 đến FR-020)
  - name: Brands
    description: Thương hiệu (FR-016)
  - name: Vehicles
    description: Hãng/dòng/thế hệ/phiên bản xe (FR-021 đến FR-026)
  - name: Fitments
    description: Tương thích xe hai chiều (FR-027 đến FR-033)
  - name: Search
    description: Tìm kiếm và tra cứu mã (FR-034 đến FR-041)
  - name: Cart
    description: Giỏ hàng (FR-050, FR-051)
  - name: Orders
    description: Đơn hàng public và admin (FR-052 đến FR-066)
  - name: Contact
    description: Form liên hệ (FR-088, FR-089)
  - name: Articles
    description: Bài viết và SEO (FR-067 đến FR-074)
  - name: Auth
    description: Xác thực admin (FR-090, FR-091)
  - name: Admin
    description: Dashboard và redirect (FR-018, FR-075 đến FR-079)
  - name: RBAC
    description: Vai trò, phân quyền, audit log (FR-080 đến FR-086)
components:
  securitySchemes:
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token của tài khoản admin (header Authorization: Bearer <token>)"
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SlugParam:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  schemas:
    Error:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          description: Thông báo tiếng Việt, thân thiện, không lộ chi tiết nội bộ
          example: Không tìm thấy sản phẩm.
        error:
          type: string
          description: Error code ổn định, xem docs/api/API_ERROR_CATALOG.md
          example: PRODUCT_NOT_FOUND
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        retryAfter:
          type: integer
          description: Số giây cần chờ (chỉ cho 423 ACCOUNT_LOCKED và 429 RATE_LIMITED)
    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: quantity
        code:
          type: string
          example: MIN_VALUE
        message:
          type: string
          example: Số lượng phải từ 1 trở lên.
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 137
        totalPages:
          type: integer
          example: 7
        notice:
          type: string
          description: "Thông báo kèm theo danh sách (vd: NO_FITMENT_FOR_VEHICLE khi xe đã chọn không có sản phẩm tương thích)"
          example: NO_FITMENT_FOR_VEHICLE
    BrandSummary:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Aisin
        slug:
          type: string
          example: aisin
    CategorySummary:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Động cơ
        slug:
          type: string
          example: engine
    CategoryTree:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Động cơ
        slug:
          type: string
          example: engine
        displayOrder:
          type: integer
          example: 1
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTree'
    ProductIdentifier:
      type: object
      required: [id, productId, identifierType, identifierValue, normalizedValue]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        identifierType:
          type: string
          enum: [PART_NUMBER, OEM_NUMBER, MANUFACTURER_PART_NUMBER, ALTERNATE_NUMBER]
        identifierValue:
          type: string
          description: Giá trị gốc (giữ nguyên như nhập)
          example: 16100-0Y010
        normalizedValue:
          type: string
          description: Giá trị chuẩn hóa (uppercase, bỏ phân cách) — dùng để tìm kiếm chính xác
          example: 161000Y010
        issuingMakeId:
          type: [string, "null"]
          format: uuid
          description: Hãng xe phát hành (chỉ OEM_NUMBER bắt buộc có, các loại khác phải null — ma trận FIX-01 M01-02)
        issuingBrandId:
          type: [string, "null"]
          format: uuid
          description: Thương hiệu phát hành (chỉ MANUFACTURER_PART_NUMBER bắt buộc có)
        isPrimary:
          type: boolean
          example: true
    ProductImage:
      type: object
      required: [id, imageUrl]
      properties:
        id:
          type: string
          format: uuid
        imageUrl:
          type: string
          format: uri
          description: URL tuyệt đối (S3/R2)
        altText:
          type: [string, "null"]
        displayOrder:
          type: integer
          example: 1
    ProductSpecification:
      type: object
      properties:
        specKey:
          type: string
          example: material
        specValue:
          type: string
          example: aluminum
    ProductSummary:
      type: object
      required: [id, sku, name, slug, price, availabilityStatus]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          description: SKU nội bộ, duy nhất
          example: SCA-000123
        name:
          type: string
          example: Bơm nước làm mát
        slug:
          type: string
          example: water-pump-aisin
        brand:
          $ref: '#/components/schemas/BrandSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        price:
          type: integer
          minimum: 0
          description: Giá VND (số nguyên đồng)
          example: 550000
        availabilityStatus:
          type: string
          enum: [IN_STOCK, OUT_OF_STOCK]
        imageUrl:
          type: [string, "null"]
          format: uri
          description: Ảnh chính (ảnh đầu tiên theo displayOrder)
        matchType:
          type: string
          enum: [SKU_EXACT, OEM_EXACT, MPN_EXACT, NAME, BRAND, FUZZY]
          description: Chỉ có trong kết quả /search — loại khớp theo thứ tự ưu tiên ADR-010
    VehicleApplicationSummary:
      type: object
      required: [id, makeId, modelId]
      properties:
        id:
          type: string
          format: uuid
        makeId:
          type: string
          format: uuid
        makeName:
          type: string
          example: Toyota
        makeSlug:
          type: string
          example: toyota
        modelId:
          type: string
          format: uuid
        modelName:
          type: string
          example: Vios
        modelSlug:
          type: string
          example: vios
        generationId:
          type: [string, "null"]
          format: uuid
        generationName:
          type: [string, "null"]
        variantId:
          type: [string, "null"]
          format: uuid
        variantName:
          type: [string, "null"]
        year:
          type: [integer, "null"]
          minimum: 1900
          maximum: 2100
    Fitment:
      type: object
      required: [id, productId, vehicleApplicationId]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        vehicleApplicationId:
          type: string
          format: uuid
        vehicleApplication:
          $ref: '#/components/schemas/VehicleApplicationSummary'
        fitmentNote:
          type: [string, "null"]
          description: "Ghi chú áp dụng (vd: chỉ bản số tự động — ví dụ minh họa)"
    ProductDetail:
      type: object
      required: [id, sku, name, slug, price, availabilityStatus, status]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          example: SCA-000123
        name:
          type: string
          example: Bơm nước làm mát
        slug:
          type: string
          example: water-pump-aisin
        brand:
          $ref: '#/components/schemas/BrandSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        price:
          type: integer
          minimum: 0
          example: 550000
        availabilityStatus:
          type: string
          enum: [IN_STOCK, OUT_OF_STOCK]
        status:
          type: string
          enum: [DRAFT, PUBLISHED, HIDDEN]
        description:
          type: [string, "null"]
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        specifications:
          type: array
          items:
            $ref: '#/components/schemas/ProductSpecification'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ProductIdentifier'
        fitments:
          type: array
          items:
            $ref: '#/components/schemas/Fitment'
        fitmentNotice:
          type: [string, "null"]
          description: NO_FITMENT_INFO khi sản phẩm chưa có dữ liệu fitment (FR-031)
        seo:
          $ref: '#/components/schemas/SeoMeta'
    SeoMeta:
      type: object
      properties:
        title:
          type: [string, "null"]
        description:
          type: [string, "null"]
        canonical:
          type: [string, "null"]
          format: uri
    VehicleMake:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Toyota
        slug:
          type: string
          example: toyota
        logoUrl:
          type: [string, "null"]
          format: uri
        isVisible:
          type: boolean
          example: true
    VehicleModel:
      type: object
      required: [id, makeId, name, slug]
      properties:
        id:
          type: string
          format: uuid
        makeId:
          type: string
          format: uuid
        name:
          type: string
          example: Vios
        slug:
          type: string
          example: vios
        isVisible:
          type: boolean
          example: true
    VehicleGeneration:
      type: object
      required: [id, modelId, name, slug]
      properties:
        id:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
        name:
          type: string
          example: Thế hệ thứ 4
        slug:
          type: string
          example: gen-4
        yearFrom:
          type: integer
          minimum: 1900
          maximum: 2100
          example: 2018
        yearTo:
          type: [integer, "null"]
          minimum: 1900
          maximum: 2100
          description: null = thế hệ còn sản xuất
        isVisible:
          type: boolean
          example: true
    VehicleVariant:
      type: object
      required: [id, generationId, name, slug]
      properties:
        id:
          type: string
          format: uuid
        generationId:
          type: string
          format: uuid
        name:
          type: string
          example: 1.5G CVT
        slug:
          type: string
          example: 1-5g-cvt
        isVisible:
          type: boolean
          example: true
    CartItem:
      type: object
      required: [itemId, productId, productName, sku, price, quantity, lineTotal]
      properties:
        itemId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
          example: Bơm nước làm mát
        sku:
          type: string
          example: SCA-000123
        price:
          type: integer
          minimum: 0
          description: Giá catalogue hiện tại (không phải giá lúc thêm)
          example: 550000
        quantity:
          type: integer
          minimum: 1
          example: 2
        lineTotal:
          type: integer
          example: 1100000
        imageUrl:
          type: [string, "null"]
          format: uri
        availabilityStatus:
          type: string
          enum: [IN_STOCK, OUT_OF_STOCK]
        unavailable:
          type: boolean
          description: true khi sản phẩm bị ẩn/xóa sau khi đã trong giỏ
        availabilityWarning:
          type: [string, "null"]
          example: OUT_OF_STOCK
        fitmentWarning:
          type: [string, "null"]
          description: Cảnh báo khi sản phẩm không tương thích với xe đã chọn (FR-029)
    Cart:
      type: object
      required: [cartToken, items, subtotal, itemCount]
      properties:
        cartToken:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: integer
          description: Tổng tiền (chỉ tính item còn khả dụng)
          example: 1100000
        itemCount:
          type: integer
          example: 2
        warnings:
          type: array
          items:
            type: string
    OrderItemSnapshot:
      type: object
      required: [productNameSnapshot, skuSnapshot, unitPriceSnapshot, quantity, lineTotal]
      properties:
        productId:
          type: string
          format: uuid
          description: Tham chiếu tới sản phẩm (RESTRICT) — chỉ để tham chiếu, hiển thị dùng snapshot
        productNameSnapshot:
          type: string
          example: Bơm nước làm mát
        skuSnapshot:
          type: string
          example: SCA-000123
        unitPriceSnapshot:
          type: integer
          example: 550000
        quantity:
          type: integer
          minimum: 1
          example: 2
        lineTotal:
          type: integer
          example: 1100000
    Order:
      type: object
      required: [orderId, orderCode, status, paymentMethod, totalAmount, items]
      properties:
        orderId:
          type: string
          format: uuid
        orderCode:
          type: string
          description: Mã đơn không đoán được, không liên tục (FR-058)
          example: SCA-7K9Q2M4X
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPING, COMPLETED, CANCELLED, REFUNDED]
          description: Khung P0 — tên trạng thái cuối do M05 chốt (PD-08)
        paymentMethod:
          type: string
          enum: [COD, BANK_TRANSFER]
        totalAmount:
          type: integer
          example: 1100000
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemSnapshot'
        customerName:
          type: string
          example: Nguyễn Văn A
        customerPhone:
          type: string
          example: "0901234567"
        shippingAddress:
          type: string
          example: 123 Đường Lê Lợi, Quận 1, TP. Hồ Chí Minh
        bankTransferInfo:
          type: [object, "null"]
          description: Chỉ khi paymentMethod = BANK_TRANSFER — thông tin chuyển khoản thật do Henry cung cấp khi triển khai
          properties:
            bankName:
              type: string
            accountNumber:
              type: string
            accountName:
              type: string
            transferContent:
              type: string
              description: Nội dung chuyển khoản chứa mã đơn
        createdAt:
          type: string
          format: date-time
    OrderSummary:
      type: object
      required: [orderId, orderCode, status, paymentMethod, totalAmount]
      properties:
        orderId:
          type: string
          format: uuid
        orderCode:
          type: string
          example: SCA-7K9Q2M4X
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPING, COMPLETED, CANCELLED, REFUNDED]
        paymentMethod:
          type: string
          enum: [COD, BANK_TRANSFER]
        totalAmount:
          type: integer
          example: 1100000
        customerName:
          type: string
          example: Nguyễn Văn A
        customerPhone:
          type: string
          example: "0901234567"
        createdAt:
          type: string
          format: date-time
    OrderLookupResult:
      type: object
      required: [orderCode, status, paymentMethod, totalAmount]
      properties:
        orderCode:
          type: string
          example: SCA-7K9Q2M4X
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPING, COMPLETED, CANCELLED, REFUNDED]
        paymentMethod:
          type: string
          enum: [COD, BANK_TRANSFER]
        totalAmount:
          type: integer
          example: 1100000
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemSnapshot'
        shippingArea:
          type: [string, "null"]
          description: Khu vực giao hàng đã che (chỉ quận/huyện + tỉnh/thành, không hiện số nhà chi tiết và SĐT đầy đủ)
    ArticleSummary:
      type: object
      required: [id, title, slug]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Cách chọn dầu động cơ đúng cho xe của bạn
        slug:
          type: string
          example: how-to-choose-engine-oil
        excerpt:
          type: [string, "null"]
        coverImageUrl:
          type: [string, "null"]
          format: uri
        publishedAt:
          type: [string, "null"]
          format: date-time
    Article:
      type: object
      required: [id, title, slug, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Cách chọn dầu động cơ đúng cho xe của bạn
        slug:
          type: string
          example: how-to-choose-engine-oil
        content:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        publishedAt:
          type: [string, "null"]
          format: date-time
        seo:
          $ref: '#/components/schemas/SeoMeta'
    ArticleSeo:
      type: object
      properties:
        seoTitle:
          type: [string, "null"]
        metaDescription:
          type: [string, "null"]
        focusKeyword:
          type: [string, "null"]
        secondaryKeywords:
          type: array
          items:
            type: string
        searchIntent:
          type: [string, "null"]
        manualOverride:
          type: array
          items:
            type: string
          description: Danh sách trường đã sửa tay (không bao giờ bị Generate ghi đè — BR-004)
    Role:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Product Manager
        description:
          type: [string, "null"]
    RoleListItem:
      type: object
      required: [id, name, userCount]
      description: Item trong danh sách vai trò (GET /roles) — giống Role, thêm userCount; schema Role dùng chung không đổi (M06-02 Rev 02)
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Product Manager
        description:
          type: [string, "null"]
        userCount:
          type: integer
          minimum: 0
          description: Số tài khoản đang được gán vai trò này (kể cả tài khoản không hoạt động)
          example: 3
    PermissionEntry:
      type: object
      required: [module, action, granted]
      properties:
        module:
          type: string
          example: products
        action:
          type: string
          example: create
        granted:
          type: boolean
          example: true
    AuditLog:
      type: object
      required: [id, actorId, action, entityType, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        action:
          type: string
          example: UPDATE_ROLE_PERMISSIONS
        entityType:
          type: string
          example: ROLE
        entityId:
          type: [string, "null"]
          format: uuid
        before:
          type: [object, "null"]
        after:
          type: [object, "null"]
        createdAt:
          type: string
          format: date-time
    Redirect:
      type: object
      required: [id, entityType, oldSlug, newSlug]
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
          enum: [CATEGORY, BRAND, PRODUCT]
        entityId:
          type: [string, "null"]
          format: uuid
        oldSlug:
          type: string
          example: engine-old
        newSlug:
          type: string
          example: engine
    DashboardSummary:
      type: object
      properties:
        pendingOrders:
          type: [integer, "null"]
          description: null + hiddenByPermission khi tài khoản không có orders.view (FR-077)
        todayOrders:
          type: integer
          example: 5
        publishedProducts:
          type: integer
          example: 120
        draftProducts:
          type: integer
          example: 8
        publishedArticles:
          type: integer
          example: 12
        ordersByStatus:
          type: object
          additionalProperties:
            type: integer
        hiddenByPermission:
          type: boolean
          example: false
        empty:
          type: boolean
          description: true khi chưa có dữ liệu thật (không hiển thị số mẫu — BR-013)
    AuthTokens:
      type: object
      description: "Access JWT claims: sub (admin id), roles (role ids), type 'access', sid (id của session đã cấp token), iat, exp (15 phút). Refresh JWT claims: sub, sid, type 'refresh', iat, exp (7 ngày). Không claim nào khác."
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Thời gian sống của access token (giây)
          example: 900
        admin:
          type: object
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
              example: admin
            roles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
    AdminMe:
      type: object
      required: [id, username, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: admin
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
          example: [products.view, products.create, orders.view]
    FitmentChangeLog:
      type: object
      required: [id, productId, vehicleApplicationId, action, changedByAdminId, changedAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        vehicleApplicationId:
          type: string
          format: uuid
        action:
          type: string
          enum: [ATTACH, DETACH]
        changedByAdminId:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time
    ImportStatus:
      type: object
      required: [importId, status]
      properties:
        importId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
        totalRows:
          type: integer
          example: 100
        successRows:
          type: integer
          example: 98
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              message:
                type: string
    SuggestItem:
      type: object
      required: [type, id, name, slug]
      properties:
        type:
          type: string
          enum: [PRODUCT, BRAND, CATEGORY]
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Bơm nước làm mát
        slug:
          type: string
          example: water-pump-aisin
paths:
  /products:
    get:
      operationId: listProducts
      tags: [Products]
      summary: Danh sách sản phẩm (lọc, sắp xếp, phân trang)
      x-required-permission: null
      security: []
      parameters:
        - name: categorySlug
          in: query
          schema: { type: string }
        - name: brandSlug
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: integer, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: integer, minimum: 0 }
        - name: availabilityStatus
          in: query
          schema: { type: string, enum: [IN_STOCK, OUT_OF_STOCK] }
        - name: vehicleApplicationId
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc, name_asc], default: newest }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách sản phẩm
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductSummary' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '400':
          description: Input không hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createProduct
      tags: [Products]
      summary: Tạo sản phẩm (admin)
      x-required-permission: products.create
      x-status: provisional
      x-blocked-by: PD-02 (số SKU mỗi sản phẩm do Henry chốt — xem API_SPEC mục 21)
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sku, categoryId, brandId, price, availabilityStatus]
              properties:
                name: { type: string, minLength: 1 }
                sku: { type: string, minLength: 1 }
                categoryId: { type: string, format: uuid }
                brandId: { type: string, format: uuid }
                price: { type: integer, minimum: 0 }
                availabilityStatus: { type: string, enum: [IN_STOCK, OUT_OF_STOCK] }
                status: { type: string, enum: [DRAFT, PUBLISHED, HIDDEN], default: DRAFT }
                description: { type: ["string", "null"] }
                identifiers:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string, enum: [PART_NUMBER, OEM_NUMBER, MANUFACTURER_PART_NUMBER, ALTERNATE_NUMBER] }
                      value: { type: string }
                      issuingMakeId: { type: ["string", "null"], format: uuid }
                      issuingBrandId: { type: ["string", "null"], format: uuid }
      responses:
        '201':
          description: Sản phẩm đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProductDetail' }
        '400':
          description: "Input không hợp lệ (vd: issuer sai ma trận CHECK)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Không có quyền products.create
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: SKU trùng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
